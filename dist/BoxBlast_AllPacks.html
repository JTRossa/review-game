<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Box Blast Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: classroom game show on a projector, loud but tidy, readable from the back row
   IDEA: the old PowerPoint "bomb" board: a wall of sealed numbered crates, one hides a bomb
   PICTURE: the crate board itself, filling the screen; question cards drop over it
   COLOUR and TYPE: Wellspring navy field, orange (Unit 2) as the hot accent, gold for multipliers, teal for points; Mulish titles, Calibri body
   LAYOUT: header strip, scoreboard column + board; stacks on narrow screens */
:root{color-scheme:dark;--navy:#002855;--deep:#001c3d;--ink:#fff;--muted:#9AA7B2;--orange:#F05023;--gold:#F5AA1E;--teal:#009682;--bteal:#006982;--panel:#0b3a6e;--line:#1f4f86;--card:#fff;--cardink:#26333F}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(1200px 700px at 70% -10%,#0a4687 0%,var(--navy) 45%,var(--deep) 100%) fixed;color:var(--ink);font:17px/1.5 Calibri,Carlito,"Segoe UI",system-ui,sans-serif;min-height:100vh;overflow-x:clip}
h1,h2,h3,.big{font-family:Mulish,Calibri,sans-serif;font-weight:900;line-height:1.08;margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;min-height:44px;padding:10px 18px;font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{background:var(--orange);color:#fff}.btn:hover{filter:brightness(1.08)}
.btn.alt{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px #ffffff55}
.btn.ok{background:var(--teal)}.btn.no{background:#7d2a2a}
.btn:disabled{opacity:.4;cursor:default}
.dots{display:inline-flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;display:block}
.dots i:nth-child(1){background:var(--orange)}.dots i:nth-child(2){background:var(--gold)}.dots i:nth-child(3){background:var(--teal)}
/* setup */
.setup{max-width:1040px;margin:0 auto;padding:clamp(20px,4vw,48px) max(4vw,16px)}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.hero h1{font-size:clamp(40px,7vw,72px)}.hero h1 span{color:var(--orange)}
.hero p{margin:8px 0 0;color:#CADCFC;max-width:46ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.box{background:#ffffff10;border:1px solid #ffffff22;border-radius:14px;padding:18px 20px}
.box h3{font-size:19px;margin-bottom:12px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{background:#ffffff14;color:#fff;min-width:56px}
.seg button[aria-pressed=true]{background:var(--orange)}
.teams{display:grid;gap:8px;margin-top:12px}
.teams label{display:flex;align-items:center;gap:10px}
.teams .sw{width:16px;height:16px;border-radius:50%;flex:none}
input[type=text],select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:8px;border:1px solid #ffffff33;background:#00000033;color:#fff}
select option{color:#000}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:flex;gap:6px;align-items:center;background:#ffffff14;padding:6px 12px;border-radius:99px;cursor:pointer;font-size:15px}
.note{color:var(--muted);font-size:14px;margin:10px 0 0}
.resume{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;border-color:var(--orange);background:#F0502322}
.start{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px}
.start .btn{font-size:22px;padding:14px 34px}
/* play */
.top{display:flex;align-items:center;gap:14px;padding:12px max(2vw,14px);border-bottom:1px solid #ffffff1f;flex-wrap:wrap}
.top .t{font-family:Mulish,sans-serif;font-weight:900;font-size:20px}.top .t span{color:var(--orange)}
.top .meta{color:var(--muted);font-size:15px;margin-right:auto}
.top button{min-height:38px;padding:6px 14px;font-size:15px}
.play{display:grid;grid-template-columns:minmax(200px,270px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:clamp(10px,1.6vw,20px);padding:clamp(10px,1.6vw,20px);height:calc(100dvh - 63px)}
.scores{display:grid;gap:10px;align-content:start;overflow:auto;padding:2px 8px 2px 2px}
.team{border-radius:12px;padding:12px 16px;background:#ffffff10;border-left:6px solid var(--c);transition:transform .2s}
.team.on{background:#ffffff22;transform:translateX(6px);box-shadow:0 0 0 2px var(--c)}
.team .n{font-weight:700;font-size:17px;display:flex;justify-content:space-between}
.team .s{font-family:Mulish,sans-serif;font-weight:900;font-size:clamp(30px,3.4vw,42px);line-height:1.1}
.team .d{font-size:14px;color:var(--muted);min-height:20px}
.banner{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#ffffff10;border-radius:12px;padding:12px 18px}
.banner b{font-family:Mulish,sans-serif;font-size:clamp(20px,2.4vw,28px)}
.banner .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.board{display:grid;gap:clamp(6px,1vw,12px);grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows),minmax(0,1fr));height:100%}
.crate{height:100%;border-radius:12px;position:relative;perspective:800px;padding:0;background:none;min-height:0}
.crate .in{position:absolute;inset:0;transition:transform .55s;transform-style:preserve-3d}
.crate.open .in{transform:rotateY(180deg)}
.crate .f,.crate .b{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;display:grid;place-items:center;font-family:Mulish,sans-serif;font-weight:900}
.crate .f{background:linear-gradient(160deg,#fff 0%,#dfe7ee 100%);color:var(--navy);font-size:clamp(22px,3.6vw,46px);box-shadow:0 5px 0 #8ea1b3,0 10px 18px #0006}
.crate .f::after{content:"";position:absolute;inset:8px;border:2px dashed #00285522;border-radius:8px}
.crate.pickable .f{animation:pulse 1.6s infinite}
.crate.pickable:hover .f{background:linear-gradient(160deg,#fff3e6,#ffd8c4);transform:translateY(-3px)}
.crate:disabled{cursor:default;opacity:1}
.crate .b{transform:rotateY(180deg);color:#fff;font-size:clamp(12px,1.7vw,22px);text-align:center;padding:4px;line-height:1.05}
.crate .b small{display:block;font:700 clamp(10px,1.1vw,14px) Calibri,Carlito,sans-serif;opacity:.85;margin-top:3px}
.k-gain{background:var(--teal)}.k-jack{background:linear-gradient(135deg,var(--gold),var(--orange))}.k-party{background:#8a3ec9}.k-gamble{background:#3d3d8f}.k-shield{background:#4f7fae}.k-extra{background:#1f8a4c}.k-mystery{background:#555}
.team .sh{font-size:12px;background:#4f7fae;border-radius:99px;padding:1px 8px;align-self:center}.k-mult{background:var(--gold);color:var(--navy)!important}.fx .big .k-mult{color:var(--navy)}.k-bomb{background:#1b1b1b}.k-loss{background:var(--orange)}.k-half{background:#b4421f}.k-swap,.k-steal,.k-gift{background:var(--bteal)}
@keyframes pulse{50%{box-shadow:0 5px 0 #8ea1b3,0 0 0 4px var(--orange),0 10px 18px #0006}}
/* overlay */
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:5;animation:fade .2s}
.card{background:var(--card);color:var(--cardink);border-radius:18px;width:min(980px,100%);max-height:94vh;overflow:auto;padding:clamp(20px,3vw,40px);box-shadow:0 20px 60px #000a;border-top:10px solid var(--c,var(--orange))}
.card .who{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;color:var(--bteal);font-size:16px}
.tag{background:#EEF3F6;border-radius:99px;padding:3px 12px;font-size:14px;color:var(--cardink)}
.card h2{color:var(--navy);font-size:clamp(24px,3.2vw,40px);margin:14px 0 20px;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;background:#EEF3F6;color:var(--cardink);font-size:clamp(17px,1.9vw,22px);font-weight:600;padding:14px 16px;border:2px solid transparent}
.opt b{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-family:Mulish,sans-serif}
.opt:hover:not(:disabled){border-color:var(--orange)}
.opt.right{background:#d5f0eb;border-color:var(--teal)}.opt.right b{background:var(--teal)}
.opt.wrong{background:#fde2d9;border-color:var(--orange)}.opt.wrong b{background:var(--orange)}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.ex{margin-top:18px;padding:14px 18px;border-radius:10px;background:#EEF3F6;border-left:6px solid var(--teal);font-size:18px}
.ex.bad{border-color:var(--orange)}
.ex strong{font-family:Mulish,sans-serif}
.model{white-space:pre-line;font-size:clamp(17px,1.9vw,21px)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;justify-content:flex-end}
.acts .l{margin-right:auto}
.card .btn.alt{color:var(--navy);box-shadow:inset 0 0 0 2px #00285533}
.timer{font-family:Mulish,sans-serif;font-weight:900;font-size:22px;color:var(--navy);min-width:60px;text-align:right}
.timer.low{color:var(--orange)}
.fx{text-align:center}
.fx .big{font-size:clamp(44px,8vw,110px);margin:6px 0}
.fx .big span{display:inline-block;border-radius:18px;padding:6px 32px;color:#fff}
.fx p{font-size:clamp(18px,2.2vw,24px);margin:8px 0}
.boom{animation:shake .5s}
@keyframes shake{20%{transform:translate(-12px,4px) rotate(-2deg)}40%{transform:translate(10px,-6px) rotate(2deg)}60%{transform:translate(-8px,2px)}80%{transform:translate(6px,-2px)}}
@keyframes fade{from{opacity:0}}
.rules{padding:clamp(18px,2.4vw,32px)}.rules .acts{margin-top:12px}.rules h2{margin:0 0 10px}
.steps{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
.steps li{display:flex;gap:12px;align-items:center;font-size:clamp(16px,1.6vw,20px)}
.steps b{flex:none;width:32px;height:32px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-family:Mulish,sans-serif}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.legend>div{background:#EEF3F6;border-radius:12px;padding:12px 14px}
.legend h3{font-size:18px;color:var(--navy);margin-bottom:8px}
.legend ul{list-style:none;padding:0;margin:0;display:grid;gap:4px;font-size:14px;line-height:1.3}
.legend li{display:flex;gap:8px;align-items:center}
.legend span{flex:none;color:#fff;font:800 13px Mulish,sans-serif;border-radius:6px;padding:3px 8px;min-width:58px;text-align:center}
.legend .pts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.guide{margin-top:18px}.guide summary{cursor:pointer;font:800 18px Mulish,sans-serif;min-height:44px;display:flex;align-items:center}
.guide ol,.guide ul{margin:6px 0;padding-left:22px}.guide li{margin:4px 0}.guide kbd{background:#ffffff22;border-radius:4px;padding:1px 6px;font-family:inherit}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:14px}
.pick button{background:#EEF3F6;color:var(--cardink);border-left:6px solid var(--c);text-align:left}
.pick button span{display:block;font-family:Mulish,sans-serif;font-weight:900;font-size:24px}
/* end */
.end{max-width:900px;margin:0 auto;padding:clamp(24px,5vw,60px) 16px;text-align:center}
.end h1{font-size:clamp(40px,7vw,76px)}.end h1 span{color:var(--gold)}
.podium{display:grid;gap:10px;margin:30px 0;text-align:left}
.podium div{display:flex;align-items:center;gap:16px;background:#ffffff12;border-radius:12px;padding:14px 20px;border-left:8px solid var(--c)}
.podium .r{font-family:Mulish,sans-serif;font-weight:900;font-size:30px;width:44px}
.podium .nm{font-size:22px;font-weight:700;margin-right:auto}
.podium .sc{font-family:Mulish,sans-serif;font-weight:900;font-size:34px}
.podium div:first-child{background:#F5AA1E33}
.foot{color:var(--muted);font-size:13px;text-align:center;padding:18px;display:flex;justify-content:center;gap:12px;align-items:center}
textarea{width:100%;min-height:140px;font:14px/1.4 ui-monospace,Consolas,monospace;border-radius:8px;padding:10px;background:#00000033;color:#fff;border:1px solid #ffffff33}
@media(max-width:820px),(max-height:520px){.play{grid-template-columns:1fr;grid-template-rows:none;height:auto}.board{height:auto;grid-template-rows:none}.crate{aspect-ratio:4/3;height:auto}.scores{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.team.on{transform:none}.team .s{font-size:28px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<!-- Question packs are listed in packs/manifest.js -->
<script>
/* Box Blast question pack: GSS Unit 2, Population and Settlement (Grade 9).
   Built from the Unit 2 lessons, Waygrounds 1-3, Review 1 and the Essay 2 evidence bank.
   Checked against the Semester 1 exam so no game question repeats an exam item.

   Question formats
   - Multiple choice: { topic, q, o: [4 options], a: index of correct option (0-3), e: explanation }
   - Open (teacher judges): { topic, type: "open", q, model: model answer }
*/
window.BOX_BLAST_PACKS = window.BOX_BLAST_PACKS || [];
window.BOX_BLAST_PACKS.push({
  id: "gss-u2",
  subject: "GSS (Grade 9)",
  title: "GSS Unit 2: Population and Settlement",
  subtitle: "Grade 9 · Semester 1 exam review",
  questions: [
    // ---------- Key terms ----------
    { topic: "Key terms", q: "What does the death rate measure?", o: ["The number of deaths per 1,000 people in a year", "The number of people aged over 65", "The number of babies who die before their first birthday", "The number of people who leave a country"], a: 0, e: "Death rate is the number of deaths per 1,000 people per year. Remember both 'per 1,000' and 'per year'." },
    { topic: "Key terms", q: "What does infant mortality measure?", o: ["Deaths of people over 80", "Babies who die before their first birthday, per 1,000 live births", "The number of babies born per year", "Children who leave school early"], a: 1, e: "Infant mortality counts deaths before age 1 per 1,000 live births. High infant mortality often means families have more children." },
    { topic: "Key terms", q: "What is life expectancy?", o: ["The age you can retire", "The oldest person in a country", "The average number of years a person can expect to live", "The number of years a family lives in one house"], a: 2, e: "Life expectancy is the average number of years a person born today can expect to live. The UK's is about 81." },
    { topic: "Key terms", q: "Someone who LEAVES their country to live somewhere else is an...", o: ["Immigrant", "Emigrant", "Refugee camp", "Dependent"], a: 1, e: "Emigrant = Exits. Immigrant = comes In." },
    { topic: "Key terms", q: "How do you work out net migration?", o: ["Births minus deaths", "Immigrants minus emigrants", "Emigrants plus immigrants", "Population divided by area"], a: 1, e: "Net migration is the number of people arriving minus the number leaving." },
    { topic: "Key terms", q: "What is population density?", o: ["The number of people per square kilometer", "The number of babies per family", "How fast a population grows", "The number of people in the capital city"], a: 0, e: "Density = people ÷ area. Australia has about 3 people per km²." },
    { topic: "Key terms", q: "What is a refugee?", o: ["Someone who moves for a better-paid job", "A tourist visiting another country", "Someone forced to leave their country because of war, persecution or disaster", "Someone who moves from a village to a city"], a: 2, e: "Refugees are forced migrants. Syrians fleeing the civil war are refugees." },
    { topic: "Key terms", q: "A country with the right number of people to give the highest living standards has...", o: ["An optimum population", "An ageing population", "Overpopulation", "Natural decrease"], a: 0, e: "Optimum population is the size that gives the highest average living standards." },
    { topic: "Key terms", q: "What does 'brain drain' mean?", o: ["Students forgetting work over the holidays", "Skilled and educated people leaving their country", "Money sent home by migrants", "People moving from cities to villages"], a: 1, e: "Brain drain is a loss for the country of origin, such as Mexico losing young, skilled adults." },
    { topic: "Key terms", q: "What is underpopulation?", o: ["Too many people for the resources", "A population that is falling", "Too few people to use the resources fully", "A country with no cities"], a: 2, e: "Underpopulated countries, like Australia, could support more people with their resources." },
    { topic: "Key terms", q: "What is an ageing population?", o: ["A rising share of people aged 65 and over", "A population with many babies", "A population with a high death rate", "A country where people retire early"], a: 0, e: "Japan is the classic example: 27% are 65 or over and only 13% are under 15." },
    { topic: "Key terms", q: "The working-age population is people aged...", o: ["0 to 14", "18 to 60", "15 to 64", "65 and over"], a: 2, e: "15 to 64 is working age. 0 to 14 and 65+ are the dependents." },

    // ---------- Calculations ----------
    { topic: "Calculations", q: "Birth rate 41 per 1,000, death rate 11 per 1,000. What is the natural increase as a percentage?", o: ["30%", "3.0%", "0.3%", "5.2%"], a: 1, e: "41 − 11 = 30 per 1,000. Divide by 10: 3.0%." },
    { topic: "Calculations", q: "Birth rate 18 per 1,000, death rate 8 per 1,000. What is the natural increase as a percentage?", o: ["10%", "1.0%", "0.1%", "2.6%"], a: 1, e: "18 − 8 = 10 per 1,000, which is 1.0%." },
    { topic: "Calculations", q: "Birth rate 7 per 1,000, death rate 12 per 1,000. What is the natural increase?", o: ["0.5%", "5%", "−0.5%", "−5%"], a: 2, e: "7 − 12 = −5 per 1,000, which is −0.5%. Negative means the population is falling (natural decrease)." },
    { topic: "Calculations", q: "Natural increase is 27 per 1,000. What is this as a percentage?", o: ["27%", "0.27%", "2.7%", "270%"], a: 2, e: "Per 1,000 to percent: divide by 10. 27 ÷ 10 = 2.7%." },
    { topic: "Calculations", q: "35% of people are aged 0 to 14 and 5% are 65 and over. What is the dependency ratio?", o: ["40", "60", "67", "150"], a: 2, e: "Working age = 100 − 40 = 60. 40 ÷ 60 × 100 = 66.7, so about 67." },
    { topic: "Calculations", q: "20% are aged 0 to 14 and 30% are 65 and over. What is the dependency ratio?", o: ["50", "100", "150", "30"], a: 1, e: "Dependents = 50%, working age = 50%. 50 ÷ 50 × 100 = 100: one dependent for every worker." },
    { topic: "Calculations", type: "open", q: "Birth rate 38 per 1,000, death rate 14 per 1,000. Calculate the natural increase as a percentage. Show your working.", model: "38 − 14 = 24 per 1,000.  24 ÷ 10 = 2.4%." },
    { topic: "Calculations", type: "open", q: "30% of people are aged 0 to 14 and 6% are 65 and over. Calculate the dependency ratio. Show your working.", model: "Dependents = 30 + 6 = 36%.  Working age = 100 − 36 = 64%.  36 ÷ 64 × 100 = 56.25, so about 56." },

    // ---------- DTM ----------
    { topic: "DTM", q: "What is Stage 1 of the Demographic Transition Model called?", o: ["Low stationary", "High fluctuating", "Late expanding", "Natural decrease"], a: 1, e: "Stage 1: high birth rate, high death rate that goes up and down, so the population stays small." },
    { topic: "DTM", q: "Why does the birth rate fall in Stage 3?", o: ["More wars", "Contraception, and more women in education and work", "Food runs out", "The death rate rises"], a: 1, e: "In Stage 3 families choose to have fewer children, so the birth rate falls quickly." },
    { topic: "DTM", q: "In which stage is natural increase usually the highest?", o: ["Stage 1", "Stage 2", "Stage 4", "Stage 5"], a: 1, e: "In Stage 2 the death rate falls but the birth rate stays high, so the gap (natural increase) is biggest." },
    { topic: "DTM", q: "Niger: birth rate 49, death rate 9 per 1,000. Which stage is it in?", o: ["Stage 1", "Stage 2", "Stage 4", "Stage 5"], a: 1, e: "High birth rate with a low death rate is Stage 2 (early expanding)." },
    { topic: "DTM", q: "A country has a birth rate of 13 and a death rate of 12 per 1,000. Which stage is it most likely in?", o: ["Stage 1", "Stage 2", "Stage 3", "Stage 4"], a: 3, e: "Both rates are low and close together: Stage 4 (low stationary)." },
    { topic: "DTM", q: "Why does the birth rate stay high in Stage 2?", o: ["Families need children to work on farms and many babies still die", "Everyone lives in cities", "The government pays people to have children", "People live to 90"], a: 0, e: "Children help on farms, contraception is limited and infant mortality is still high." },
    { topic: "DTM", q: "What is Stage 5 also called?", o: ["Early expanding", "High fluctuating", "Natural decrease", "Late expanding"], a: 2, e: "In Stage 5 the birth rate is lower than the death rate, so the population falls. Japan is the example." },

    // ---------- Pyramids & dependency ----------
    { topic: "Pyramids & dependency", q: "Which part of a population pyramid shows the oldest people?", o: ["The base", "The middle", "The top", "The left side"], a: 2, e: "Age goes up the pyramid: young at the base, old at the top." },
    { topic: "Pyramids & dependency", q: "A pyramid is narrow at the base and wide at the top. What does it show?", o: ["A young population", "An ageing population", "A high birth rate", "Many migrants arriving"], a: 1, e: "Few births and many older people: an ageing population, like Japan." },
    { topic: "Pyramids & dependency", q: "A pyramid has almost straight, vertical sides. What does this show?", o: ["High birth and death rates", "A low birth rate and a low death rate", "A war has just happened", "A very young population"], a: 1, e: "Each age group is a similar size because few babies are born and most people live to old age (Stage 4)." },
    { topic: "Pyramids & dependency", q: "Which shape would you expect for Niger's population pyramid?", o: ["Very wide base, narrow top", "Narrow base, wide top", "Straight sides", "Wide in the middle only"], a: 0, e: "About half of Niger's people are under 15, so the base is very wide." },
    { topic: "Pyramids & dependency", q: "Which group pays most of the taxes that support dependents?", o: ["People aged 0 to 14", "People aged 15 to 64", "People aged 65 and over", "Refugees"], a: 1, e: "The working-age population supports both young and elderly dependents." },
    { topic: "Pyramids & dependency", q: "A country has a very young population. What will it most need to spend more on?", o: ["Pensions", "Care homes", "Schools and childcare", "Hearing aids"], a: 2, e: "Many young dependents means pressure on schools, health care for children, and later on jobs." },

    // ---------- Short answers (P.E.E.) ----------
    { topic: "Short answers (P.E.E.)", q: "A question begins 'Explain one reason why...'. How many reasons should you write about?", o: ["One, well explained", "Two, briefly", "Three, as a list", "As many as you can"], a: 0, e: "Marks come from one point that is well explained. Three weak points still score low." },
    { topic: "Short answers (P.E.E.)", q: "In a P.E.E. short answer, what must the Evidence sentence contain?", o: ["Your opinion", "A quotation from your teacher", "A summary of the whole war", "One specific fact: a name, a date or a number"], a: 3, e: "'Lots of soldiers died' is vague. '57,470 Allied casualties on 1 July 1916' is evidence." },

    { topic: "Short answers (P.E.E.)", type: "open", q: "Explain one way the Agadir Crisis of 1911 brought Britain and France closer together. Use P.E.E.", model: "One way the Agadir Crisis brought Britain and France closer was that Britain backed France against Germany. In July 1911 Germany sent the gunboat Panther to Agadir, but Britain supported France, and in the Treaty of Fez France kept Morocco. This meant that Germany's attempt to split the Entente failed, and Britain and France began to plan together, so the Entente became stronger." },

    // ---------- Sources (HIPP and RAVEN) ----------
    { topic: "Sources (HIPP and RAVEN)", q: "In HIPP, what does the H stand for?", o: ["Historical context", "Honesty", "Hidden meaning", "How useful"], a: 0, e: "H is Historical context: what was happening when the source was made." },
    { topic: "Sources (HIPP and RAVEN)", q: "Which HIPP heading asks 'Who was this source made for?'", o: ["Historical context", "Purpose", "Point of view", "Intended audience"], a: 3, e: "Writers change what they say for their audience. A general speaking to his troops may hide bad news." },
    { topic: "Sources (HIPP and RAVEN)", q: "In RAVEN, the A stands for 'Ability to see'. Which question does it ask?", o: ["Is the author famous?", "Was the author there, and could they see what happened?", "Would the author gain from people believing it?", "Is the source long enough?"], a: 1, e: "An eyewitness at Anzac Cove has strong ability to see, but only of one small part of the landing." },
    { topic: "Sources (HIPP and RAVEN)", q: "The German Embassy printed a warning in US newspapers before the Lusitania sailed, saying attacks in the war zone were fair. Which RAVEN check matters most?", o: ["Ability to see", "Expertise", "Vested interest", "Reputation"], a: 2, e: "Germany wanted to put the blame on the passengers, so it had a vested interest in presenting the attacks as legal." },
    { topic: "Sources (HIPP and RAVEN)", q: "Why can a biased recruitment poster still be useful to a historian?", o: ["It shows what the government wanted people to believe", "Biased sources are always the most accurate", "It tells us exactly how many men volunteered", "It is never useful"], a: 0, e: "Always ask 'useful for what?' Propaganda is excellent evidence of what the government wanted people to think." },
    { topic: "Sources (HIPP and RAVEN)", q: "A photograph shows the Kaiser touring Tangier in 1905. What is its main limitation?", o: ["Photographs were not invented in 1905", "It shows the visit, but not what the Kaiser said or wanted", "It was taken by a British soldier", "It shows the wrong country"], a: 1, e: "A photograph shows what happened, not the aims behind it. You need context to explain why the visit mattered." },
    { topic: "Sources (HIPP and RAVEN)", q: "On 11 April 1918, Haig told his tired troops the enemy had 'made little progress'. Why might he say this?", o: ["He had not heard about the attack", "He wanted to tell the Germans his plans", "He was writing a history book after the war", "He wanted to keep his troops fighting, so he played down German success"], a: 3, e: "Think about audience and purpose: an order to his own troops was meant to keep up morale." },
    { topic: "Sources (HIPP and RAVEN)", q: "A British magazine cartoon from August 1911 shows Germany hitting a rock labeled 'Entente Cordiale'. Whose point of view does it show?", o: ["Germany's, that the Entente was weak", "Russia's, that it should join the war", "Britain's, that the Entente was strong and Germany could not break it", "A neutral view with no side"], a: 2, e: "It was drawn for a British audience during the Agadir Crisis, so it presents the Entente as solid as rock." },
    { topic: "Sources (HIPP and RAVEN)", q: "In a 'How do Sources A and B differ?' answer, what must you include?", o: ["A detail from both sources", "A detail from Source A only", "Your own opinion of the war", "A list of everything in each source"], a: 0, e: "Name the difference, support it from both sources, and if you can, say why they differ." },
    { topic: "Sources (HIPP and RAVEN)", type: "open", q: "A poster from 1915 says 'Women of Britain Say Go!' Use two HIPP headings to explain how useful it is for studying recruitment in Britain.", model: "Purpose: the poster was made to persuade women to encourage their men to volunteer, so it is useful because it shows the methods the government used, such as pride and guilt. Historical context: by 1915 more men were needed, and by early 1916 about 2.5 million had volunteered but conscription still began. This means the poster shows what the government wanted people to do, but not how many men actually joined because of it." },
    { topic: "Sources (HIPP and RAVEN)", type: "open", q: "Give one strength and one limitation of Haig's Special Order of the Day (11 April 1918) for a historian studying the Ludendorff Offensive.", model: "A strength is that it was written by the British commander-in-chief during the attack, so it shows how serious things were: he says the enemy attacked on a fifty-mile front and orders troops to hold 'to the last man'. A limitation is that it was written to his own tired troops to keep them fighting, so he may play down how far the Germans had advanced. It also cannot tell us why the offensive later failed." },

    // ---------- Long answers ----------
    { topic: "Long answers", q: "When you B.U.G. a long answer question, what does the B mean?", o: ["Box the command phrase", "Begin with a story", "Bullet-point your facts", "Balance both sides"], a: 0, e: "Box the command phrase, Underline the focus, Glance at the dates." },
    { topic: "Long answers", q: "A question says '\"X was the main reason...\" How far do you agree?' What should you do?", o: ["Only write about X", "Tell the story of the war in order", "Explain X, weigh it against other factors, and reach a judgment", "Agree, because the question says so"], a: 2, e: "You can agree, disagree or take a middle view. Marks reward the quality of your reasons." },
    { topic: "Long answers", q: "Which is the best claim for 'The convoy system was the main reason Germany lost the war at sea'?", o: ["The convoy system started in 1917.", "Convoys were important, but the British blockade mattered more because it starved Germany while its fleet stayed in port.", "There were many ships in the war at sea.", "I will now write about convoys, mines and Jutland."], a: 1, e: "A claim answers the question in one sentence and gives a judgment with a reason." },
    { topic: "Long answers", q: "What should a strong conclusion do?", o: ["Add new facts you forgot", "Repeat the question word for word", "Say both sides are equal and stop", "Rank the factors and give a verdict with 'because'"], a: 3, e: "No new facts in the conclusion. Rank the factors and justify your verdict." },
    { topic: "Long answers", q: "In P.E.E.L., what is the L for?", o: ["Length", "Link back to the question or to another factor", "List more facts", "Look at the sources"], a: 1, e: "The Link shows how the paragraph answers the question, or connects one factor to another." },
    { topic: "Long answers", q: "Which is an argument FOR General Haig?", o: ["He commanded from far behind the lines", "He kept Passchendaele going in deep mud for months", "He led the British army to victory in the Hundred Days Offensive in 1918", "He kept using the same tactics after 1 July 1916"], a: 2, e: "The other three are arguments against Haig, the 'Butcher of the Somme'." },
    { topic: "Long answers", q: "Which sentence links two factors in an answer about why Germany was defeated?", o: ["The British blockade left Germans close to starvation, which helped cause strikes, riots and the collapse at home.", "The Americans arrived in 1917.", "Amiens was a battle in 1918.", "The war ended on 11 November 1918."], a: 0, e: "Linking factors is a top-level skill: it shows how one factor caused or strengthened another." },
    { topic: "Long answers", type: "open", q: "'The Battle of Jutland was a victory for Germany.' How far do you agree? Give your claim and one P.E.E.L. paragraph.", model: "Claim: I agree only to a limited extent, because Germany sank more ships but Britain kept control of the sea. Paragraph: Germany could claim a victory in losses, because Britain lost 14 ships and over 6,000 men, and Germany lost fewer. However, after Jutland the German High Seas Fleet went back to port and stayed there for the rest of the war. This meant the British blockade continued and kept supplies from Germany. Therefore Jutland was a short-term success for Germany but a long-term victory for Britain." },
    { topic: "Long answers", type: "open", q: "Explain why the Gallipoli campaign failed. Name three factors and say which mattered most.", model: "First, the delay: the naval attack began on 19 February 1915, but troops did not land until 25 April, so the Turks had two months to prepare. Second, the landings: troops had no experience of beach landings and no up-to-date maps, and steep cliffs rose above the beaches, so they were trapped in a new stalemate. Third, conditions: heat, flies, dysentery and typhoid weakened the men. The delay mattered most, because it gave the Turks time to strengthen their defenses, which made the landing problems far worse." }
  ]
});

};
const TARGETED = ["swap","steal","gift"];
const MIX = {

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem("boxblast:" + k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem("boxblast:" + k, JSON.stringify(v)); } catch {} } };

const hashPack = decodeURIComponent(location.hash.slice(1));
let cfg = Object.assign({ pack: PACKS[0]?.id, teams: 4, names: ["Team 1","Team 2","Team 3","Team 4","Team 5"], size: 20, mix: "classic", timer: 0, steal: true, topics: null, sound: true }, store.get("cfg", {}));

/* ---------------- sound (synthesized, works offline) ---------------- */
const SFX = (() => {
  let ctx = null;
  const ac = () => { if (!ctx) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; ctx = new A(); } if (ctx.state === "suspended") ctx.resume(); return ctx; };
  const tone = (f, t0, dur, type = "sine", vol = .25, f2 = null) => {
    const c = ac(); if (!c) return; const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05);
  };
  const noise = (t0, dur, vol = .5, lp = 1200) => {
    const c = ac(); if (!c) return; const n = c.sampleRate * dur, buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 2;
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime + t0;
    src.buffer = buf; f.type = "lowpass"; f.frequency.setValueAtTime(lp, t); f.frequency.exponentialRampToValueAtTime(60, t + dur);
    g.gain.setValueAtTime(vol, t); src.connect(f).connect(g).connect(c.destination); src.start(t);
  };
  const S = {
    correct() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .08, .25, "triangle", .22)); },
    wrong() { tone(196, 0, .22, "sawtooth", .15); tone(147, .2, .4, "sawtooth", .15); },
    open() { for (let i = 0; i < 8; i++) noise(i * .05, .05, .18, 3000); },
    gain() { tone(988, 0, .12, "square", .12); tone(1319, .1, .4, "square", .12); },
    jackpot() { [784, 988, 1175, 1568, 1976].forEach((f, i) => tone(f, i * .07, .3, "square", .1)); },
    mult() { [660, 880, 1100, 1320, 1760, 2200].forEach((f, i) => tone(f, i * .06, .18, "sine", .2)); },
    bomb() { noise(0, 1.6, .9, 900); tone(110, 0, 1.2, "sine", .5, 30); },

    tick() { tone(1500, 0, .05, "square", .08); },
    buzzer() { tone(110, 0, .7, "sawtooth", .25); tone(116, 0, .7, "sawtooth", .2); },
    win() { [[523, 0], [523, .15], [523, .3], [784, .45], [659, .75], [784, .95], [1047, 1.15]].forEach(([f, t]) => tone(f, t, .35, "triangle", .25)); }
  };
  return n => { if (cfg.sound !== false) try { S[n] && S[n](); } catch {} };
})();
const fxSound = (fx, c) => fx === "dbl" ? (c && c.flip ? "jackpot" : "bomb") : ({ p500: "jackpot", p1000: "jackpot", x2: "mult", x3: "mult", x5: "mult", bomb: "bomb", nuke: "bomb", m100: "loss", m300: "loss", m500: "loss", half: "loss", topcut: "loss", swap: "swap", steal: "swap", gift: "swap", robin: "swap", party: "jackpot", shield: "mult", extra: "correct" }[fx] || "gain");

function pack() { return PACKS.find(p => p.id === cfg.pack) || PACKS[0]; }
function topicsOf(p) { return [...new Set((p?.questions || []).map(q => q.topic || "General"))]; }

function makeBoxes(n, mixName) {
  const w = MIX[mixName], keys = Object.keys(w), tot = keys.reduce((s, k) => s + w[k], 0);
  const draw = () => { let r = Math.random() * tot; for (const k of keys) { if ((r -= w[k]) <= 0) return k; } return keys[0]; };
  const list = Array.from({ length: n }, draw);
  // every board gets at least one big win and one disaster (none of the disasters on Calm boards of 12)
  const must = [["p500","p1000","x2","x3","x5"], mixName === "calm" ? ["m100","half"] : ["bomb","nuke"]];
  const mid = list.map((k, i) => FX[k].k === "gain" && +k.slice(1) <= 200 ? i : -1).filter(i => i > -1);
  must.forEach(set => { if (!list.some(k => set.includes(k)) && mid.length) list[mid.splice(Math.random() * mid.length | 0, 1)[0]] = set.find(k => k in w) || set[0]; });
  return shuffle(list).map((fx, i) => ({ n: i + 1, fx, open: false, by: null, res: null }));
}

      <div class="box"><h3>Board size</h3>${seg("size", [12,16,20,25,30])}

  const tm = $("#tm");
  if (tm) { const upd = () => { const r = Math.max(0, S.timer - Math.floor((Date.now() - S.cur.started) / 1000)); tm.textContent = r ? r + "s" : "Time!"; tm.classList.toggle("low", r <= 5);
      if (r !== S.cur.lastTick) { if (r > 0 && r <= 5) SFX("tick"); if (r === 0 && S.cur.lastTick !== undefined) SFX("buzzer"); S.cur.lastTick = r; }
      if (!r) clearInterval(tick); }; upd(); tick = setInterval(upd, 250); }
  if (S.phase === "pick") $(".banner")?.scrollIntoView({ block: "nearest" });
}
function renderEnd() {
  const r = S.teams.map(t => t).sort((a, b) => b.score - a.score);
  app.innerHTML = `<div class="end"><span class="dots"><i></i><i></i><i></i></span><h1><span>${esc(r[0].name)}</span> wins!</h1>
    <div class="podium">${r.map((t, i) => `<div style="--c:${t.c}"><span class="r">${i + 1}</span><span class="nm">${esc(t.name)}</span><span class="sc">${t.score}</span></div>`).join("")}</div>
    <p class="note">${S.asked} questions asked · ${S.boxes.filter(b => b.open).length} boxes opened</p>
    <div class="acts" style="justify-content:center"><button class="btn alt" id="undo2" ${hist.length ? "" : "disabled"}>Back to the board</button><button class="btn alt" id="setup">New game setup</button><button class="btn" id="again">Play again, same settings</button></div></div>`;
  app.querySelector("#undo2").onclick = undo;
  app.querySelector("#setup").onclick = () => { S = null; render(); };
  app.querySelector("#again").onclick = () => { const p = pack(), tps = topicsOf(p); startGame(cfg.topics && cfg.topicsPack === cfg.pack ? tps.filter(t => cfg.topics.includes(t)) : tps); };
}
window.boxBlast = { state: () => S };
document.addEventListener("keydown", e => {
  if (!S || e.target.matches("input,textarea,select")) return;
  const k = e.key.toLowerCase();
  if (k === "u") return undo();
  if (S.phase === "question" && "abcd".includes(k) && k.length === 1) { const b = app.querySelector(`[data-opt="${"abcd".indexOf(k)}"]`); if (b && !b.disabled) b.click(); return; }
  if (k === " " || k === "enter") {
    const b = app.querySelector("#play,#askb,#topick,#cont,#next,#show");
    if (b) { e.preventDefault(); b.click(); }
  }
});
render();
}
</script>
</body>
